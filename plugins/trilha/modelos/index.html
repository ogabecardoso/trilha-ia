<title>Trilha Claude Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cabeçalho com a régua das 24 semanas como assinatura; abas; uma coluna de leitura (~70ch) com mapa por fase e leitor de aula. */
:root {
  --bg: #EDF1EE;
  --surface: #FFFFFF;
  --sunken: #E2E8E4;
  --ink: #13201B;
  --muted: #52615A;
  --line: #C9D3CD;
  --accent: #2346C4;
  --accent-ink: #FFFFFF;
  --ok: #2B7A4B;
  --f1: #2F67B8; --f2: #7247C2; --f3: #BE3A72; --f4: #3B8735; --f5: #0D817E; --f6: #AD6A10; --f7: #13201B; --fb: #6B7671;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1311; --surface: #141C19; --sunken: #1B2521; --ink: #E3EBE6; --muted: #97A59E; --line: #2A3732;
    --accent: #93A9FF; --accent-ink: #0D1311; --ok: #7CD29F;
    --f1: #7FA8EC; --f2: #B39AF0; --f3: #F08CB4; --f4: #86CB7B; --f5: #5ECFCA; --f6: #E5AF60; --f7: #E3EBE6; --fb: #A3ADA8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1311; --surface: #141C19; --sunken: #1B2521; --ink: #E3EBE6; --muted: #97A59E; --line: #2A3732;
  --accent: #93A9FF; --accent-ink: #0D1311; --ok: #7CD29F;
  --f1: #7FA8EC; --f2: #B39AF0; --f3: #F08CB4; --f4: #86CB7B; --f5: #5ECFCA; --f6: #E5AF60; --f7: #E3EBE6; --fb: #A3ADA8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1000px; margin: 0 auto; padding-inline: 20px; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
code, kbd { font-family: var(--mono); font-size: .86em; }
:not(pre) > code { background: var(--sunken); padding: .1em .35em; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.15; margin: 0; }

/* Cabeçalho */
.top { padding-block: 28px 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
.top-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.brand h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 800; font-stretch: 118%; letter-spacing: -.01em; }
.brand p { margin: 6px 0 0; color: var(--muted); }
.status { display: flex; gap: 28px; font-variant-numeric: tabular-nums; }
.status div { display: grid; gap: 2px; }
.status b { font-family: var(--display); font-size: 26px; font-weight: 700; font-stretch: 110%; line-height: 1; }
.status span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

.ruler { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px; margin-top: 22px; }
.cell { position: relative; display: block; height: 30px; border-radius: 3px; text-decoration: none;
  background: color-mix(in srgb, var(--c) 20%, var(--surface)); color: var(--ink); }
.cell span { position: absolute; inset: 0; display: grid; place-items: center; font: 600 11px/1 var(--mono); color: color-mix(in srgb, var(--c) 70%, var(--ink)); }
.cell[data-done="1"] { background: var(--c); }
.cell[data-done="1"] span { color: var(--surface); }
.cell[data-now="1"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell[data-now="1"]::after { content: "hoje"; position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%);
  font: 600 10px/1 var(--mono); color: var(--ink); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 24px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: -1px; }

/* Abas */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.tabs nav { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; }
.tabs a { flex: none; padding: 7px 14px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 700; font-size: 14px; }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tabs a:hover:not([aria-current="page"]) { color: var(--ink); background: var(--sunken); }

main { padding-block: 28px 80px; }
.muted { color: var(--muted); }
.eyebrow { font: 600 12px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* Próxima aula */
.next { display: grid; grid-template-columns: 1fr auto; gap: 12px 24px; align-items: center; padding: 20px 22px; margin-bottom: 36px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.next h2 { font-size: 22px; font-stretch: 105%; margin-top: 6px; }
.next p { margin: 4px 0 0; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font: 700 14px/1 var(--body); text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }

/* Mapa */
.phase { margin-top: 48px; }
.phase:first-of-type { margin-top: 0; }
.phase-head { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: start; padding-bottom: 16px; border-bottom: 2px solid var(--c); }
.phase-num { grid-row: span 3; width: 44px; height: 44px; border-radius: 8px; background: var(--c); color: var(--surface);
  display: grid; place-items: center; font: 800 18px/1 var(--display); font-stretch: 120%; }
.phase-head h2 { font-size: clamp(22px, 3.4vw, 30px); font-weight: 800; font-stretch: 112%; }
.phase-head p { margin: 0; color: var(--muted); max-width: 68ch; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 8px; font-size: 14px; }
.facts b { font-weight: 700; }
.sell { color: var(--c); font-weight: 700; }

.week { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px 20px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.week-id { font: 600 13px/1.4 var(--mono); color: var(--muted); }
.week-id b { display: block; font: 800 22px/1 var(--display); font-stretch: 112%; color: var(--ink); margin-bottom: 4px; }
.week[data-now="1"] .week-id b::after { content: "hoje"; margin-left: 8px; padding: 2px 6px; vertical-align: 3px; border-radius: 4px;
  font: 600 10px/1 var(--mono); background: var(--ink); color: var(--bg); }
.week h3 { font-size: 18px; font-stretch: 104%; margin-bottom: 8px; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.item a { display: grid; grid-template-columns: 18px 58px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 6px 8px; margin-inline: -8px;
  border-radius: 6px; text-decoration: none; color: var(--ink); }
.item a:hover { background: var(--sunken); }
.item .id { font: 600 12px/1 var(--mono); color: var(--muted); }
.item .t { font-weight: 700; }
.item .o { display: block; color: var(--muted); font-size: 14px; line-height: 1.45; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); align-self: center; }
.dot[data-s="concluida"] { background: var(--ok); border-color: var(--ok); }
.dot[data-s="em_andamento"] { border-color: var(--ok); background: linear-gradient(90deg, var(--ok) 50%, transparent 50%); }
.dot[data-s="dispensada"] { border-style: dashed; }
.dot[data-s="atual"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; font: 600 10px/1.5 var(--mono);
  text-transform: uppercase; letter-spacing: .05em; background: var(--sunken); color: var(--muted); vertical-align: 2px; }
.tag.on { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.weekend { margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }

/* Leitor de aula */
.lesson-head { display: grid; gap: 10px; padding-bottom: 20px; border-bottom: 2px solid var(--c); }
.lesson-head h1 { font-size: clamp(28px, 4.6vw, 42px); font-weight: 800; font-stretch: 112%; }
.lesson-head .obj { font-size: 18px; max-width: 64ch; margin: 0; }
.lesson-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 32px; margin-top: 28px; align-items: start; }
.side { position: sticky; top: 72px; display: grid; gap: 16px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.box h4 { margin: 0 0 10px; font: 600 12px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; font-size: 15px; line-height: 1.45; }
.checks li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; }
.checks li::before { content: ""; width: 14px; height: 14px; margin-top: 4px; border: 2px solid var(--line); border-radius: 3px; }
.checks li[data-ok="1"]::before { background: var(--ok); border-color: var(--ok); }
.cmd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 6px;
  background: var(--sunken); font: 600 14px/1.3 var(--mono); }
.copy { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 5px;
  padding: 4px 8px; font: 600 11px/1 var(--mono); cursor: pointer; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); }
.pager a { max-width: 48%; text-decoration: none; color: var(--ink); }
.pager a span { display: block; }
.pager a:last-child { text-align: right; margin-left: auto; }

.prose { max-width: 70ch; min-width: 0; }
.prose h2 { font-size: 22px; font-stretch: 106%; margin: 36px 0 12px; padding-top: 4px; }
.prose h2:first-child { margin-top: 0; }
.prose h3 { font-size: 18px; margin: 24px 0 8px; }
.prose p, .prose ul, .prose ol { margin: 0 0 14px; }
.prose li { margin-bottom: 6px; }
.prose pre { position: relative; margin: 10px 0 18px; padding: 14px 16px; padding-right: 72px; overflow-x: auto; border-radius: 8px;
  background: var(--sunken); border: 1px solid var(--line); font: 14px/1.55 var(--mono); }
.prose pre code { background: none; padding: 0; font-size: inherit; white-space: pre; }
.prose pre .copy { position: absolute; top: 8px; right: 8px; }
.prose blockquote { margin: 16px 0; padding: 12px 16px; border-radius: 8px; background: color-mix(in srgb, var(--c) 10%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line)); }
.prose blockquote p:last-child { margin-bottom: 0; }
.table-wrap { overflow-x: auto; margin: 6px 0 18px; }
.prose table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.45; }
.prose th, .prose td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.prose th { font: 600 12px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.prose > p:first-child > code:only-child { background: none; padding: 0; color: var(--muted); font-size: 12px; }
.pending { padding: 18px 20px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }

/* Referência e textos */
.search { width: 100%; max-width: 420px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); font: 16px var(--body); margin-bottom: 8px; }
.ref-group { margin-top: 28px; }
.ref-group h2 { font-size: 20px; font-stretch: 108%; margin-bottom: 8px; }
.ref { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) auto; gap: 4px 16px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.ref code { background: none; padding: 0; font-weight: 600; font-size: 14px; color: var(--ink); }
.ref small { font: 600 11px/1 var(--mono); color: var(--muted); }
.page h2 { font-size: 24px; font-stretch: 108%; margin: 40px 0 12px; }
.page h2:first-child { margin-top: 0; }
.page p, .page li { max-width: 68ch; }
.hour { display: grid; grid-template-columns: 1fr 4fr 1fr; gap: 3px; margin: 14px 0 8px; max-width: 640px; }
.hour div { padding: 10px 12px; border-radius: 4px; background: var(--sunken); font-size: 14px; line-height: 1.3; }
.hour div:nth-child(2) { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.hour b { display: block; font: 700 18px/1.1 var(--display); font-stretch: 108%; }
.change { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 20px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.loading { padding: 40px 0; color: var(--muted); }

@media (max-width: 760px) {
  .lesson-grid { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; order: -1; }
  .week { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .week-id b { display: inline; margin-right: 8px; }
  .next { grid-template-columns: minmax(0, 1fr); }
  .ref { grid-template-columns: minmax(0, 1fr) auto; }
  .ref span { grid-column: 1 / -1; }
  .change { grid-template-columns: minmax(0, 1fr); }
  .status { gap: 20px; }
}
@media (max-width: 520px) {
  .wrap { padding-inline: 16px; }
  .cell { height: 24px; }
  .cell span { font-size: 9px; }
  .hour { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: in .18s ease-out; }
  @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <h1>Trilha Claude Code</h1>
        <p id="sub">De iniciante a especialista em soluções com IA</p>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="ruler" id="ruler" aria-label="As 24 semanas da trilha"></div>
    <div class="legend" id="legend"></div>
  </div>
</header>

<div class="tabs">
  <div class="wrap">
    <nav id="tabs" aria-label="Seções">
      <a href="#mapa" data-v="mapa">Mapa</a>
      <a href="#aula" data-v="aula">Aula</a>
      <a href="#referencia" data-v="referencia">Referência</a>
      <a href="#estudar" data-v="estudar">Como estudar</a>
      <a href="#mudancas" data-v="mudancas">O que mudou</a>
    </nav>
  </div>
</div>

<main class="wrap"><div id="view" class="view"><p class="loading">Carregando a trilha…</p></div></main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  "use strict";
  var MES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  var DIA = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  var S = { trilha: null, prog: { registros: {} }, itens: [], porId: {}, fases: {}, md: {} };
  var view = document.getElementById("view");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function iso(s) { var p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function add(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function dm(d) { return d.getDate() + " " + MES[d.getMonth()]; }
  function diaLongo(d) { return DIA[d.getDay()] + ", " + dm(d); }
  function ini(n) { return add(iso(S.trilha.inicio), (n - 1) * 7); }
  function faixa(a, b) { return a.getMonth() === b.getMonth() ? a.getDate() + "–" + dm(b) : dm(a) + " – " + dm(b); }
  function semanaHoje() {
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var d = Math.floor((t - iso(S.trilha.inicio)) / 86400000);
    return d < 0 ? 0 : Math.floor(d / 7) + 1;
  }
  function cor(faseId) { return "var(--" + (faseId || "fb").toLowerCase() + ")"; }
  function reg(id) { return (S.prog.registros || {})[id] || null; }
  function estado(id) { var r = reg(id); if (r && r.status) return r.status; var it = S.porId[id]; if (it && it.dispensada) return "dispensada"; return S.prog.aulaAtual === id ? "atual" : ""; }

  function indexar() {
    S.trilha.fases.forEach(function (f, i) { f.num = i + 1; S.fases[f.id] = f; });
    S.trilha.semanas.forEach(function (w) {
      w.aulas.forEach(function (a, i) {
        a.tipo = "aula"; a.semana = w.n; a.fase = w.fase; a.dia = add(ini(w.n), i); a.pos = i + 1;
        S.itens.push(a); S.porId[a.id] = a;
      });
      var fimSem = add(ini(w.n), 5);
      if (w.desafio) {
        var d = w.desafio; d.tipo = "desafio"; d.semana = w.n; d.fase = w.fase; d.dia = fimSem;
        S.itens.push(d); S.porId[d.id] = d;
      }
      if (w.prova) {
        var f = S.fases[w.prova], p = f.prova; p.id = f.id; p.tipo = "prova"; p.semana = w.n; p.fase = f.id; p.dia = fimSem;
        S.itens.push(p); S.porId[p.id] = p;
      }
    });
    (S.trilha.bonus.aulas || []).forEach(function (b) { b.tipo = "bonus"; b.fase = "FB"; S.itens.push(b); S.porId[b.id] = b; });
  }

  function semanaFeita(w) { return w.aulas.every(function (a) { var e = estado(a.id); return e === "concluida" || e === "dispensada"; }); }

  function cabecalho() {
    var total = 0, feitas = 0;
    S.itens.forEach(function (i) { if (i.tipo === "aula" && !i.dispensada) { total++; if (estado(i.id) === "concluida") feitas++; } });
    var h = semanaHoje(), txt;
    if (h === 0) txt = "<div><b>S01</b><span>começa " + diaLongo(iso(S.trilha.inicio)) + "</span></div>";
    else if (h > 24) txt = "<div><b>Fim</b><span>trilha concluída no calendário</span></div>";
    else txt = "<div><b>S" + String(h).padStart(2, "0") + "</b><span>semana de 24</span></div>";
    document.getElementById("status").innerHTML = txt + "<div><b>" + feitas + "<small style=\"font-size:15px;color:var(--muted)\"> / " + total + "</small></b><span>aulas concluídas</span></div>";

    document.getElementById("ruler").innerHTML = S.trilha.semanas.map(function (w) {
      var a = ini(w.n), b = add(a, 4);
      return '<a class="cell" href="#' + w.aulas[0].id + '" style="--c:' + cor(w.fase) + '" data-done="' + (semanaFeita(w) ? 1 : 0) + '" data-now="' + (w.n === h ? 1 : 0) +
        '" title="Semana ' + w.n + " · " + faixa(a, b) + " · " + esc(w.titulo) + '" aria-label="Semana ' + w.n + ": " + esc(w.titulo) + '"><span>' + w.n + "</span></a>";
    }).join("");
    document.getElementById("legend").innerHTML = S.trilha.fases.map(function (f) {
      var s = f.semanas[0] === f.semanas[1] ? "S" + f.semanas[0] : "S" + f.semanas[0] + "–" + f.semanas[1];
      return '<span style="--c:' + cor(f.id) + '"><i></i>' + esc(f.nome) + " · " + s + "</span>";
    }).join("");
  }

  function linkItem(i) {
    var st = estado(i.id), escrito = i.dispensada ? '<span class="tag">dispensada</span>' : i.conteudo ? '<span class="tag on">escrita</span>' : "";
    var rotulo = i.tipo === "aula" ? DIA[i.dia.getDay()] : i.tipo === "prova" ? "prova" : "fim de sem.";
    return '<li class="item"><a href="#' + i.id + '"><span class="dot" data-s="' + st + '"></span><span class="id">' + rotulo +
      '</span><span><span class="t">' + inl(i.titulo) + "</span>" + escrito + '<span class="o">' + inl(i.objetivo || i.descricao || i.tarefa || "") + "</span></span></a></li>";
  }

  function proxima() {
    var id = S.prog.aulaAtual || "S01A1", a = S.porId[id];
    if (!a) return "";
    var quando = a.dia ? diaLongo(a.dia) : "";
    return '<section class="next" style="--c:' + cor(a.fase) + '"><div><div class="eyebrow">Próxima aula · ' + esc(id) + " · " + esc(quando) +
      "</div><h2>" + inl(a.titulo) + "</h2><p>" + inl(a.objetivo || "") + '</p></div><a class="btn" href="#' + esc(id) + '">Abrir aula</a></section>';
  }

  function mapa() {
    var h = semanaHoje(), out = [proxima()];
    S.trilha.fases.forEach(function (f) {
      var semanas = S.trilha.semanas.filter(function (w) { return w.fase === f.id; });
      var faixaSem = f.semanas[0] === f.semanas[1] ? "Semana " + f.semanas[0] : "Semanas " + f.semanas[0] + " a " + f.semanas[1];
      var facts = [];
      if (f.segmento) facts.push("<span><b>Segmento:</b> " + esc(f.segmento) + "</span>");
      if (f.cliente) facts.push("<span><b>Cliente:</b> " + esc(f.cliente) + "</span>");
      if (f.marco) facts.push('<span class="sell">Ao final, você vende: ' + esc(f.marco) + "</span>");
      out.push('<section class="phase" style="--c:' + cor(f.id) + '"><div class="phase-head"><div class="phase-num">' + f.num + '</div><div class="eyebrow">Fase ' + f.num + " · " + faixaSem +
        "</div><h2>" + esc(f.nome) + "</h2><p>" + inl(f.resumo) + "</p>" + (facts.length ? '<div class="facts" style="grid-column:2">' + facts.join("") + "</div>" : "") + "</div>");
      semanas.forEach(function (w) {
        var a = ini(w.n), b = add(a, 4);
        var itens = w.aulas.map(linkItem).join("");
        var fim = w.desafio ? S.porId[w.desafio.id] : w.prova ? S.porId[w.prova] : null;
        out.push('<div class="week" id="semana-' + w.n + '" data-now="' + (w.n === h ? 1 : 0) + '"><div class="week-id"><b>S' + String(w.n).padStart(2, "0") + "</b>" + faixa(a, b) +
          "</div><div><h3>" + inl(w.titulo) + '</h3><ul class="items">' + itens + "</ul>" +
          (fim ? '<ul class="items weekend">' + linkItem(fim) + "</ul>" : "") + "</div></div>");
      });
      out.push("</section>");
    });
    var bn = S.trilha.bonus;
    out.push('<section class="phase" style="--c:var(--fb)"><div class="phase-head"><div class="phase-num">+</div><div class="eyebrow">Opcional</div><h2>' + esc(bn.titulo) + "</h2><p>" + esc(bn.resumo) +
      '</p></div><div class="week"><div class="week-id"><b>Bônus</b></div><div><ul class="items">' +
      bn.aulas.map(function (x) { return '<li class="item"><a href="#' + x.id + '"><span class="dot"></span><span class="id">' + x.id + '</span><span><span class="t">' + inl(x.titulo) + '</span><span class="o">' + inl(x.objetivo) + "</span></span></a></li>"; }).join("") +
      "</ul></div></div></section>");
    view.innerHTML = out.join("");
    if (h >= 1 && h <= 24 && !location.hash) {
      var el = document.getElementById("semana-" + h);
      if (el && h > 1) el.scrollIntoView({ block: "start" });
    }
  }

  function copiar(btn, texto) {
    try {
      navigator.clipboard.writeText(texto).then(function () { btn.textContent = "copiado"; setTimeout(function () { btn.textContent = "copiar"; }, 1400); }, function () { selecionar(btn); });
    } catch (e) { selecionar(btn); }
  }
  function selecionar(btn) {
    var alvo = btn.parentNode.querySelector("code") || btn.parentNode;
    var r = document.createRange(); r.selectNodeContents(alvo);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = "Ctrl+C";
  }

  function renderMd(md) {
    var html;
    try { html = window.marked ? marked.parse(md) : "<pre><code>" + esc(md) + "</code></pre>"; }
    catch (e) { html = "<pre><code>" + esc(md) + "</code></pre>"; }
    var box = document.createElement("div"); box.innerHTML = html;
    var h1 = box.querySelector("h1"); if (h1) h1.remove();
    box.querySelectorAll("table").forEach(function (t) { var w = document.createElement("div"); w.className = "table-wrap"; t.parentNode.insertBefore(w, t); w.appendChild(t); });
    box.querySelectorAll("a[href^='http']").forEach(function (a) { a.target = "_blank"; a.rel = "noopener"; });
    box.querySelectorAll("pre").forEach(function (p) { var b = document.createElement("button"); b.className = "copy"; b.type = "button"; b.textContent = "copiar"; p.appendChild(b); });
    return box.innerHTML;
  }

  function carregarMd(id, alvo) {
    if (S.md[id]) { alvo.innerHTML = S.md[id]; return; }
    fetch("aulas/" + id + ".md").then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (t) { S.md[id] = renderMd(t); alvo.innerHTML = S.md[id]; })
      .catch(function () { alvo.innerHTML = '<div class="pending">Não consegui carregar o texto desta aula. Ele está em <code>manual/aulas/' + esc(id) + '.md</code>, e a <code>/aula</code> lê de lá.</div>'; });
  }

  function aula(id) {
    var i = S.porId[id];
    if (!i) { view.innerHTML = '<p class="pending">Não encontrei <code>' + esc(id) + '</code>. <a href="#mapa">Voltar ao mapa</a>.</p>'; return; }
    var f = S.fases[i.fase], r = reg(id) || {};
    var lista = S.itens.filter(function (x) { return x.tipo !== "bonus"; });
    var k = lista.indexOf(i), ant = k > 0 ? lista[k - 1] : null, prox = k >= 0 ? lista[k + 1] : null;
    var eyebrow, corpo, lado = [];
    if (i.tipo === "aula") eyebrow = "Fase " + f.num + " · Semana " + i.semana + " · Aula " + i.pos + " de 5 · " + diaLongo(i.dia);
    else if (i.tipo === "bonus") eyebrow = "Bônus · Power Platform";
    else eyebrow = "Fase " + f.num + " · Fim de semana da semana " + i.semana + " · " + diaLongo(i.dia);

    if (i.tipo === "prova") {
      var crit = r.criterios || [];
      lado.push('<div class="box"><h4>Critérios de avaliação</h4><ul class="checks">' + i.criterios.map(function (c, n) { return '<li data-ok="' + (crit[n] ? 1 : 0) + '">' + inl(c) + "</li>"; }).join("") + "</ul></div>");
      corpo = '<div class="prose"><h2>A tarefa</h2><p>' + inl(i.tarefa) + "</p><p>A prova é feita sem roteiro. Os critérios ao lado foram definidos antes, e a avaliação segue só eles.</p></div>";
    } else {
      if (i.checklist) {
        var ck = r.checklist || [];
        lado.push('<div class="box"><h4>Sei fazer isso?</h4><ul class="checks">' + i.checklist.map(function (c, n) { return '<li data-ok="' + (ck[n] ? 1 : 0) + '">' + inl(c) + "</li>"; }).join("") + "</ul></div>");
      }
      corpo = i.conteudo ? '<div class="prose" id="md"><p class="loading">Carregando a aula…</p></div>'
        : '<div class="prose"><div class="pending"><p><b>Esta aula ainda não foi escrita.</b></p><p>O conteúdo é escrito semana a semana e ajustado ao seu progresso. Quando chegar a hora, rode <code>' + esc((S.trilha.comando || "/aula") + " preparar") + '</code> no Claude Code.</p></div></div>';
    }
    if (i.tipo !== "bonus") {
      var C = S.trilha.comando || "/aula", cmd = i.tipo === "aula" ? C + " " + id : i.tipo === "desafio" ? C + " desafio" : C + " prova";
      lado.unshift('<div class="box"><h4>No Claude Code</h4><div class="cmd"><span>' + esc(cmd) + '</span><button class="copy" type="button" data-copy="' + esc(cmd) + '">copiar</button></div>' +
        '<p class="muted" style="font-size:14px;margin:10px 0 0">Abra o terminal na pasta do laboratório, rode <code>claude</code> e digite o comando.</p></div>');
    }
    if (r.status) lado.push('<div class="box"><h4>Registro</h4><p style="margin:0;font-size:15px">' + (r.status === "concluida" ? "Concluída" : "Em andamento") + (r.data ? " em " + esc(r.data.split("-").reverse().join("/")) : "") +
      (r.dificuldades ? '</p><p class="muted" style="margin:8px 0 0;font-size:14px">Dificuldade: ' + inl(r.dificuldades) : "") + "</p></div>");

    view.innerHTML = '<article style="--c:' + cor(i.fase) + '"><header class="lesson-head"><div class="eyebrow">' + esc(eyebrow) + " · " + esc(id) + "</div><h1>" + inl(i.titulo) + '</h1><p class="obj">' +
      inl(i.objetivo || i.descricao || "") + '</p></header><div class="lesson-grid">' + corpo + '<aside class="side">' + lado.join("") + "</aside></div>" +
      '<nav class="pager">' + (ant ? '<a href="#' + ant.id + '"><span class="eyebrow">← ' + esc(ant.id) + "</span><span>" + inl(ant.titulo) + "</span></a>" : "") +
      (prox ? '<a href="#' + prox.id + '"><span class="eyebrow">' + esc(prox.id) + " →</span><span>" + inl(prox.titulo) + "</span></a>" : "") + "</nav></article>";
    if (i.conteudo) carregarMd(id, document.getElementById("md"));
    window.scrollTo(0, 0);
  }

  function referencia() {
    var html = '<input class="search" id="busca" type="search" placeholder="Filtrar: contexto, sessão, Esc…" aria-label="Filtrar a referência">' +
      '<p class="muted" style="margin:4px 0 0;font-size:14px">Cresce a cada semana com o que você aprendeu. O número ao lado indica a semana em que o item foi ensinado.</p>';
    html += S.trilha.referencia.map(function (g) {
      return '<section class="ref-group"><h2>' + esc(g.grupo) + "</h2>" + g.itens.map(function (x) {
        return '<div class="ref" data-q="' + esc((x.k + " " + x.d + " " + g.grupo).toLowerCase()) + '"><code>' + esc(x.k) + "</code><span>" + inl(x.d) + "</span><small>S" + String(x.s).padStart(2, "0") + "</small></div>";
      }).join("") + "</section>";
    }).join("");
    view.innerHTML = html;
    document.getElementById("busca").addEventListener("input", function (e) {
      var q = e.target.value.trim().toLowerCase();
      view.querySelectorAll(".ref").forEach(function (r) { r.hidden = q && r.getAttribute("data-q").indexOf(q) < 0; });
      view.querySelectorAll(".ref-group").forEach(function (g) { g.hidden = !g.querySelector(".ref:not([hidden])"); });
    });
  }

  function estudar() {
    var marcos = S.trilha.fases.filter(function (f) { return f.marco; }).map(function (f) {
      return "<tr><td>" + esc(f.nome) + "</td><td>S" + f.semanas[1] + " · " + dm(add(ini(f.semanas[1]), 4)) + "</td><td>" + esc(f.marco) + "</td></tr>";
    }).join("");
    var C = S.trilha.comando || "/aula", L = S.trilha.laboratorio || {}, pasta = L.pasta || "", nome = pasta.split(/[\\\/]/).pop() || "laboratorio";
    var regras = (L.regras || []).map(function (r) { return "<li>" + inl(r) + "</li>"; }).join("");
    view.innerHTML = '<div class="page prose" style="--c:var(--accent)">' +
      "<h2>Uma aula, uma hora</h2><p>De segunda a sexta. Cada aula tem três partes, sempre nesta ordem:</p>" +
      '<div class="hour"><div><b>10 min</b>Conceito</div><div><b>40 min</b>Prática guiada com o Claude Code</div><div><b>10 min</b>Checklist e fixação</div></div>' +
      "<p>No fim de semana vem o desafio, sem passo a passo, que junta a semana. Nas semanas que fecham uma fase, o desafio dá lugar à prova da fase.</p>" +
      "<h2>Como abrir a aula</h2><ol><li>Abra o terminal na pasta do laboratório" + (pasta ? ": <code>cd \"" + esc(pasta) + "\"</code>" : ".") + "</li><li>Rode <code>claude</code>.</li><li>Digite <code>" + C + "</code>. O tutor lê seu progresso e continua de onde você parou.</li></ol>" +
      '<div class="table-wrap"><table><thead><tr><th>Comando</th><th>O que faz</th></tr></thead><tbody>' +
      [["", "Dá a próxima aula"], [" S01A3", "Abre uma aula específica"], [" S01A3 passo 7", "Retoma do passo 7, depois de um <code>/clear</code>"], [" status", "Resumo do seu progresso"],
       [" desafio", "Desafio do fim de semana"], [" prova", "Prova da fase"], [" preparar", "Escreve a próxima semana, ajustada às suas dificuldades"]].map(function (r) { return "<tr><td><code>" + C + r[0] + "</code></td><td>" + r[1] + "</td></tr>"; }).join("") +
      "</tbody></table></div><p>Esta página lê o mesmo <code>progresso.json</code> que a <code>" + C + "</code> atualiza. O mapa mostra o progresso registrado na última publicação.</p>" +
      (regras ? "<h2>Regras do laboratório</h2><ul>" + regras + "</ul>" : "") +
      "<h2>As pastas</h2><pre><code>" + esc(nome) + "/\n├── kit/          seu kit de agência (semanas 4 e 5)\n├── exercicios/   as práticas, uma pasta por semana\n├── manual/       esta página, o mapa e as aulas\n├── progresso.json\n└── projetos/     um repositório Git para cada cliente</code></pre>" +
      '<h2>O que você vende ao fim de cada fase</h2><div class="table-wrap"><table><thead><tr><th>Fase</th><th>Termina</th><th>Você vende</th></tr></thead><tbody>' + marcos + "</tbody></table></div></div>";
    view.querySelectorAll("pre").forEach(function (p) { var b = document.createElement("button"); b.className = "copy"; b.type = "button"; b.textContent = "copiar"; p.appendChild(b); });
  }

  function mudancas() {
    view.innerHTML = '<div class="page"><h2>O que mudou</h2><p class="muted">Novidades do Claude Code e ajustes da trilha, do mais recente para o mais antigo.</p>' +
      S.trilha.mudancas.slice().reverse().map(function (m) {
        return '<div class="change"><div class="eyebrow">' + esc(m.data.split("-").reverse().join("/")) + "<br>v" + esc(m.versao) + "</div><div>" + inl(m.texto) + "</div></div>";
      }).join("") + "</div>";
  }

  function rota() {
    var h = decodeURIComponent(location.hash.replace(/^#/, "")) || "mapa";
    var v = h;
    if (h === "aula") { v = "aula"; h = S.prog.aulaAtual || "S01A1"; }
    else if (S.porId[h]) v = "aula";
    document.querySelectorAll("#tabs a").forEach(function (a) { a.toggleAttribute("aria-current", a.getAttribute("data-v") === v); if (a.getAttribute("data-v") === v) a.setAttribute("aria-current", "page"); });
    view.classList.remove("view"); void view.offsetWidth; view.classList.add("view");
    if (v === "aula") aula(h);
    else if (v === "referencia") referencia();
    else if (v === "estudar") estudar();
    else if (v === "mudancas") mudancas();
    else mapa();
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest(".copy");
    if (!b) return;
    var t = b.getAttribute("data-copy");
    if (!t) { var c = b.parentNode.querySelector("code"); t = c ? c.textContent : ""; }
    copiar(b, t);
  });
  window.addEventListener("hashchange", rota);

  Promise.all([
    fetch("trilha.json").then(function (r) { return r.json(); }),
    fetch("progresso.json").then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
  ]).then(function (res) {
    S.trilha = res[0]; S.prog = res[1] || {}; S.prog.registros = S.prog.registros || {};
    indexar(); var a0 = iso(S.trilha.inicio), a1 = add(a0, 23 * 7 + 4); document.getElementById("sub").textContent = "De iniciante a especialista em soluções com IA · " + dm(a0) + " " + a0.getFullYear() + " a " + dm(a1) + " " + a1.getFullYear(); cabecalho(); rota();
  }).catch(function () {
    view.innerHTML = '<div class="pending">Não consegui carregar <code>trilha.json</code>. Republique o artefato com os arquivos do mapa.</div>';
  });
})();
</script>
